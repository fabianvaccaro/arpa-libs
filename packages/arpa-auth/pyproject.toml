[project]
name = "arpa-auth"
version = "0.1.0"
description = "Password hashing, JWT access/refresh tokens and opaque tokens, done one way for every ARPA service."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabián Vaccaro" }]
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1",       # MIT
    "PyJWT[crypto]>=2.8",      # MIT; cryptography is Apache-2.0/BSD
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/fabianvaccaro/arpa-libs/tree/main/packages/arpa-auth"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arpa_auth"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
addopts = "--cov=arpa_auth --cov-report=term-missing --cov-fail-under=90"
