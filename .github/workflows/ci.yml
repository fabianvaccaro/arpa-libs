name: ci

on:
  push:
    branches: [main]
    tags: ["*/v*"]
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.ls.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: ls
        run: echo "list=$(ls packages | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  test:
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.list) }}
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: python3 ../../scripts/check_licenses.py .

  release:
    # Tag "<package>/v<version>": build that package and attach it to a GitHub release.
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches version
        id: tag
        run: |
          pkg="${GITHUB_REF_NAME%/v*}"; ver="${GITHUB_REF_NAME##*/v}"
          got=$(grep -m1 '^version' "packages/$pkg/pyproject.toml" | cut -d'"' -f2)
          [ "$got" = "$ver" ] || { echo "tag $ver != pyproject $got"; exit 1; }
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
      - run: uv build
        working-directory: packages/${{ steps.tag.outputs.pkg }}
      - name: Release
        working-directory: packages/${{ steps.tag.outputs.pkg }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
            --notes "See packages/${{ steps.tag.outputs.pkg }}/CHANGELOG.md"
